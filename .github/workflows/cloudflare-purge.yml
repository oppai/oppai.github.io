name: Purge Cloudflare Cache

on:
  push:
    branches: [master]

permissions:
  actions: read
  contents: read

jobs:
  purge-cache:
    environment: master build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to deploy this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            conclusion=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$GITHUB_SHA" \
              --jq 'first(.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")) | .conclusion // ""')

            case "$conclusion" in
              success) exit 0 ;;
              "")
                sleep 10
                ;;
              *)
                echo "GitHub Pages deployment ended with: $conclusion"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for GitHub Pages deployment of $GITHUB_SHA"
          exit 1
      - name: Purge cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_AUTH_KEY: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
        shell: bash
        run: |
          : "${CLOUDFLARE_ZONE:?Set the CLOUDFLARE_ZONE GitHub Actions secret}"
          : "${CLOUDFLARE_AUTH_KEY:?Set the CLOUDFLARE_AUTH_KEY GitHub Actions secret}"

          curl --silent --show-error --fail-with-body \
            --request POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_AUTH_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"hosts":["oppai.ninja"]}' |
            jq --exit-status --raw-output '
              if .success == true then "Cloudflare accepted the cache purge"
              else error("Cloudflare rejected the cache purge: " + ((.errors // []) | tostring))
              end
            '
      - name: Warm homepage and asset caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset_paths=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | startswith("docs/assets/"))) | .path | ltrimstr("docs/") | split("/") | map(@uri) | join("/")')

          if [[ -z "$asset_paths" ]]; then
            echo "No published assets found for $GITHUB_SHA"
            exit 1
          fi

          while IFS= read -r asset_path; do
            curl --fail --silent --show-error --compressed --max-time 30 \
              --output /dev/null \
              --write-out '%{url_effective} HTTP %{http_code}, CF-Cache-Status: %header{cf-cache-status}\n' \
              "https://oppai.ninja/$asset_path"
          done <<< "$(printf '\n%s' "$asset_paths")"
